# Crib from here: https://takala.consulting/updated-tmux-conf/ 
unbind C-b
set -g prefix ^A
bind a send-prefix

# screen ^C c
unbind ^C
bind ^C new-window
bind c new-window
 
# detach ^D d
unbind ^D
bind ^D detach
 
# displays *
unbind *
bind * list-clients
 
# next ^@ ^N sp n
unbind ^@
bind ^@ next-window
unbind ^N
bind ^N next-window
unbind " "
bind " " next-window
unbind n
bind n next-window
 
# title A
unbind A
bind A command-prompt "rename-window %%"
 
# other ^A
unbind ^A
bind ^A last-window
 
# prev ^H ^P p ^?
unbind ^H
bind ^H previous-window
unbind ^P
bind ^P previous-window
unbind p
bind p previous-window
unbind BSpace
bind BSpace previous-window
 
# windows ^W w
unbind ^W
bind ^W list-windows
unbind w
bind w list-windows
 
# quit \
unbind \
bind \ confirm-before "kill-server"
 
# kill K k
unbind K
bind K confirm-before "kill-window"
unbind k
bind k confirm-before "kill-window"
 
# redisplay ^L l
unbind ^L
bind ^L refresh-client
unbind l
bind l refresh-client
 
# " windowlist -b
unbind '"'
bind '"' choose-window

# Splits
bind-key - split-window
bind-key | split-window -h
 
# History
set -g history-limit 100000
 
# Terminal emulator window title
set -g set-titles on
set -g set-titles-string 'term'
 
# Notifying if other windows has activities
setw -g monitor-activity off
set -g visual-activity off
 
# Status bar colour per host. Defaults here, override per host lower down.
# -u to reset the the status on :source ~/.tmux.conf and clear out orphaned config
set -gu window-status-style
set -g status-style "bg=blue,fg=black"
set -g window-status-current-style "bg=white,fg=blue,bold"

# cx macbook - green
if -F '#{==:#{host_short},Mac}' {
  set -g status-style "bg=#005f00,fg=white"
  set -g window-status-current-style "bg=white,fg=#005f00,bold"
}

# merlin - purple
if -F '#{==:#{host_short},merlin}' {
  set -g status-style "bg=#5f0087,fg=white"
  set -g window-status-current-style "bg=white,fg=#5f0087,bold"
}

# fgm - red
if -F '#{==:#{host_short},fgm}' {
  set -g status-style "bg=#870000,fg=white"
  set -g window-status-current-style "bg=white,fg=#870000,bold"
}

set-option -g status-justify left
set -g status-left-length 40
set -g status-left ' [#{USER}@#h] '
set -g status-right '#{default} %a %Y-%m-%d %H:%M:%S '

# # Orange border for active pane, black for inactive
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=colour208"

# window list options
set-option -g automatic-rename off
#et -g window-status-format         '#I:#(pwd="#{pane_current_path}"; echo ${pwd####*/})#F'

set -g base-index 1

set-option -g default-shell /bin/bash
set-option -g mouse off
